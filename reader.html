<!DOCTYPE html>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' blob:; script-src 'self'; style-src 'self' blob: 'unsafe-inline'; img-src 'self' blob: data:; connect-src 'self' blob: data: *; frame-src blob: data:; object-src blob: data:; form-action 'none';">
<title>Foliate Reader</title>
<style>
:root {
    --active-bg: rgba(0, 0, 0, .05);
}
@supports (color-scheme: light dark) {
    @media (prefers-color-scheme: dark) {
        :root {
            --active-bg: rgba(255, 255, 255, .1);
        }
    }
}
html {
    height: 100%;
}
body {
    margin: 0 auto;
    height: 100%;
    font: menu;
    font-family: system-ui, sans-serif;
}
#drop-target {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    visibility: hidden;
}
#drop-target h1 {
    font-weight: 900;
}
#file-button {
    font: inherit;
    background: none;
    border: 0;
    padding: 0;
    text-decoration: underline;
    cursor: pointer;
}
.icon {
    display: block;
    fill: none;
    stroke: currentcolor;
    stroke-width: 2px;
}
.empty-state-icon {
    margin: auto;
}
.toolbar {
    box-sizing: border-box;
    position: absolute;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    height: 48px;
    padding: 6px;
    transition: opacity 250ms ease;
    visibility: hidden;
}
.toolbar button {
    padding: 3px;
    border-radius: 6px;
    background: none;
    border: 0;
    color: GrayText;
}
.toolbar button:hover {
    background: rgba(0, 0, 0, .1);
    color: currentcolor;
}
#header-bar {
    top: 0;
    height: 56px;
    padding: 10px 18px;
    border-bottom: 1px solid color-mix(in srgb, CanvasText 10%, transparent);
    background: Canvas;
    gap: 16px;
    visibility: visible;
}
.is-empty #side-bar-button, .is-empty #reading-mode,
.is-empty #menu-button .menu [role="group"] {
    display: none;
}
.global-settings-label {
    display: none;
}
.is-empty .global-settings-label {
    display: inline;
    font-size: 14px;
}
.is-empty #menu-button > button {
    color: CanvasText;
}
#menu-button > button {
    display: flex;
    align-items: center;
    gap: 6px;
}
#header-title {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    max-width: 55%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: GrayText;
    font-size: 18px;
    font-weight: 400;
    pointer-events: none;
}
#reader-actions {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-left: auto;
}
#reading-mode {
    border: 0;
    background: Canvas;
    color: #0866df;
    font: inherit;
    font-size: 18px;
    padding: 6px;
    cursor: pointer;
}
#reading-mode:disabled {
    color: GrayText;
    cursor: default;
}
button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid #0866df;
    outline-offset: 3px;
}
#translation-status-bar {
    position: absolute;
    z-index: 1;
    top: 60px;
    right: 24px;
    max-width: calc(100% - 48px);
    display: flex;
    align-items: center;
    gap: 10px;
    color: GrayText;
    font-size: 12px;
    background: Canvas;
}
#translation-status-bar[hidden] {
    display: none;
}
#translation-status-bar button {
    border: 0;
    padding: 4px;
    background: none;
    color: #0866df;
    font: inherit;
    cursor: pointer;
}
#translation-status-bar[data-state="error"] {
    color: #b83f32;
}
#nav-bar {
    bottom: 0;
    padding: 10px 18px;
    background: Canvas;
}
#progress-slider {
    flex-grow: 1;
    margin: 0 12px;
    visibility: hidden;
}
#side-bar {
    visibility: hidden;
    box-sizing: border-box;
    position: absolute;
    z-index: 2;
    top: 0;
    left: 0;
    height: 100%;
    width: 320px;
    transform: translateX(-320px);
    display: flex;
    flex-direction: column;
    background: Canvas;
    color: CanvasText;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 40px rgba(0, 0, 0, .2);
    transition: visibility 0s linear 300ms, transform 300ms ease;
}
#side-bar.show {
    visibility: visible;
    transform: translateX(0);
    transition-delay: 0s;
}
#dimming-overlay {
    visibility: hidden;
    position: fixed;
    z-index: 2;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, .2);
    opacity: 0;
    transition: visibility 0s linear 300ms, opacity 300ms ease;
}
#dimming-overlay.show {
    visibility: visible;
    opacity: 1;
    transition-delay: 0s;
}
#side-bar-header {
    padding: 1rem;
    display: flex;
    border-bottom: 1px solid rgba(0, 0, 0, .1);
    align-items: center;
}
#side-bar-cover {
    height: 10vh;
    min-height: 60px;
    max-height: 180px;
    border-radius: 3px;
    border: 0;
    background: lightgray;
    box-shadow: 0 0 1px rgba(0, 0, 0, .1), 0 0 16px rgba(0, 0, 0, .1);
    margin-inline-end: 1rem;
}
#side-bar-cover:not([src]) {
    display: none;
}
#side-bar-title {
    margin: .5rem 0;
    font-size: inherit;
}
#side-bar-author {
    margin: .5rem 0;
    font-size: small;
    color: GrayText;
}
#toc-view {
    padding: .5rem;
    overflow-y: scroll;
}
#toc-view li, #toc-view ol {
    margin: 0;
    padding: 0;
    list-style: none;
}
#toc-view a, #toc-view span {
    display: block;
    border-radius: 6px;
    padding: 8px;
    margin: 2px 0;
}
#toc-view a {
    color: CanvasText;
    text-decoration: none;
}
#toc-view a:hover {
    background: var(--active-bg);
}
#toc-view span {
    color: GrayText;
}
#toc-view svg {
    margin-inline-start: -24px;
    padding-inline-start: 5px;
    padding-inline-end: 6px;
    fill: CanvasText;
    cursor: default;
    transition: transform .2s ease;
    opacity: .5;
}
#toc-view svg:hover {
    opacity: 1;
}
#toc-view [aria-current] {
    font-weight: bold;
    background: var(--active-bg);
}
#toc-view [aria-expanded="false"] svg {
    transform: rotate(-90deg);
}
#toc-view [aria-expanded="false"] + [role="group"] {
    display: none;
}
.menu-container {
    position: relative;
}
.menu, .menu ul {
    list-style: none;
    padding: 0;
    margin: 0;
}
.menu {
    visibility: hidden;
    position: absolute;
    right: 0;
    background: Canvas;
    color: CanvasText;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 16px rgba(0, 0, 0, .1);
    padding: 6px;
    cursor: default;
}
.menu.show {
    visibility: visible;
}
.menu button {
    width: 100%;
    padding: 6px 12px;
    text-align: start;
    white-space: nowrap;
    font: inherit;
    color: CanvasText;
}
.menu .settings-action {
    padding: 4px 0 0;
    margin-top: 4px;
    border-top: 1px solid color-mix(in srgb, CanvasText 12%, transparent);
}
.menu li {
    padding: 6px 12px;
    padding-left: 24px;
    border-radius: 6px;
}
.menu li:hover {
    background: var(--active-bg);
}
.menu li[aria-checked="true"] {
    background-position: center left;
    background-repeat: no-repeat;
    background-image: url('data:image/svg+xml;utf8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2224%22%20height%3D%2224%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%223%22%2F%3E%3C%2Fsvg%3E');
}
.popover {
    background: Canvas;
    color: CanvasText;
    border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, .2), 0 0 16px rgba(0, 0, 0, .1), 0 0 32px rgba(0, 0, 0, .1);
}
.popover-arrow-down {
    fill: Canvas;
    filter: drop-shadow(0 -1px 0 rgba(0, 0, 0, .2));
}
.popover-arrow-up {
    fill: Canvas;
    filter: drop-shadow(0 1px 0 rgba(0, 0, 0, .2));
}
#translation-settings {
    box-sizing: border-box;
    width: min(480px, calc(100vw - 32px));
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 28px;
    border: 1px solid color-mix(in srgb, CanvasText 14%, transparent);
    border-radius: 14px;
    background: Canvas;
    color: CanvasText;
    box-shadow: 0 20px 80px #0002;
}
#translation-settings::backdrop {
    background: #0003;
}
.dialog-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
}
.dialog-heading h2 {
    margin: 0;
    font-size: 22px;
    font-weight: 600;
}
.dialog-description {
    margin: 14px 0 24px;
    font-size: 14px;
    line-height: 1.7;
    color: GrayText;
}
#translation-settings label {
    display: block;
    margin: 20px 0 8px;
    font-size: 14px;
    font-weight: 500;
}
#translation-settings input {
    box-sizing: border-box;
    width: 100%;
    border: 1px solid color-mix(in srgb, CanvasText 22%, transparent);
    border-radius: 7px;
    padding: 11px 12px;
    background: Canvas;
    color: CanvasText;
    font: inherit;
    font-size: 14px;
}
.field-hint {
    margin: 8px 0 0;
    color: GrayText;
    font-size: 12px;
    line-height: 1.6;
}
#translation-settings-error {
    margin: 16px 0 0;
    color: #b83f32;
    font-size: 13px;
    line-height: 1.6;
}
.dialog-actions {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    margin-top: 28px;
}
#translation-settings button {
    border: 0;
    background: none;
    color: GrayText;
    font: inherit;
    font-size: 14px;
    cursor: pointer;
    padding: 8px 0;
}
#translation-settings #save-translation-settings {
    border-radius: 7px;
    background: #0866df;
    color: white;
    padding: 10px 18px;
}
#translation-settings button:disabled {
    opacity: .55;
    cursor: default;
}
@media (max-width: 700px) {
    #header-title {
        left: 62px;
        transform: none;
        max-width: calc(100% - 250px);
    }
    #reader-actions {
        gap: 8px;
    }
}
</style>
<body class="is-empty">
<input type="file" id="file-input" hidden>
<div id="drop-target" class="filter">
    <div>
        <svg class="icon empty-state-icon" width="72" height="72" aria-hidden="true">
            <path d="M36 18s-6-6-12-6-15 6-15 6v42s9-6 15-6 12 6 12 6c4-4 8-6 12-6s12 2 15 6V18c-6-4-12-6-15-6-4 0-8 2-12 6m0 0v42"/>
        </svg>
        <h1>Drop a book here!</h1>
        <p>Or <button id="file-button">choose a file</button> to open it.</p>
    </div>
</div>
<div id="dimming-overlay" aria-hidden="true"></div>
<div id="side-bar">
    <div id="side-bar-header">
        <img id="side-bar-cover">
        <div>
            <h1 id="side-bar-title"></h1>
            <p id="side-bar-author"></p>
        </div>
    </div>
    <div id="toc-view"></div>
</div>
<div id="header-bar" class="toolbar">
    <button id="side-bar-button" aria-label="Show sidebar">
        <svg class="icon" width="24" height="24" aria-hidden="true">
            <path d="M 4 6 h 16 M 4 12 h 16 M 4 18 h 16"/>
        </svg>
    </button>
    <div id="header-title">Foliate Reader</div>
    <div id="reader-actions">
    <select id="reading-mode" aria-label="阅读模式">
        <option value="original">原文</option>
        <option value="bilingual">双语</option>
        <option value="translation">仅译文</option>
    </select>
    <div id="menu-button" class="menu-container">
        <button aria-label="设置" aria-haspopup="dialog">
            <svg class="icon" width="24" height="24" aria-hidden="true">
                <path d="M5 12.7a7 7 0 0 1 0-1.4l-1.8-2 2-3.5 2.7.5a7 7 0 0 1 1.2-.7L10 3h4l.9 2.6 1.2.7 2.7-.5 2 3.4-1.8 2a7 7 0 0 1 0 1.5l1.8 2-2 3.5-2.7-.5a7 7 0 0 1-1.2.7L14 21h-4l-.9-2.6a7 7 0 0 1-1.2-.7l-2.7.5-2-3.4 1.8-2Z"/>
                <circle cx="12" cy="12" r="3"/>
            </svg>
            <span class="global-settings-label">设置</span>
        </button>
    </div>
    </div>
</div>
<div id="translation-status-bar" hidden>
    <span id="translation-status" role="status" aria-live="polite"></span>
    <button id="translation-retry" hidden>重试</button>
    <button id="translation-status-settings" hidden>翻译设置</button>
</div>
<div id="nav-bar" class="toolbar">
    <button id="left-button" aria-label="Go left">
        <svg class="icon" width="24" height="24" aria-hidden="true">
            <path d="M 15 6 L 9 12 L 15 18"/>
        </svg>
    </button>
    <input id="progress-slider" type="range" min="0" max="1" step="any" list="tick-marks">
    <datalist id="tick-marks"></datalist>
    <button id="right-button" aria-label="Go right">
        <svg class="icon" width="24" height="24" aria-hidden="true">
            <path d="M 9 6 L 15 12 L 9 18"/>
        </svg>
    </button>
</div>
<dialog id="translation-settings" aria-labelledby="translation-settings-title">
    <form id="translation-settings-form">
        <div class="dialog-heading">
            <h2 id="translation-settings-title">翻译设置</h2>
            <button type="button" id="close-translation-settings">关闭</button>
        </div>
        <p class="dialog-description">配置保存在本机，适用于所有书籍和阅读标签页。支持 OpenAI 兼容接口，默认翻译成简体中文。</p>
        <label for="api-url">API Base URL</label>
        <input id="api-url" name="url" type="url" placeholder="https://api.example.com/v1" required autocomplete="off" spellcheck="false">
        <label for="api-key">API Key</label>
        <input id="api-key" name="apiKey" type="password" placeholder="填写 API Key" autocomplete="off" spellcheck="false" aria-describedby="api-key-hint">
        <p id="api-key-hint" class="field-hint">API Key 使用系统加密，保存在本机，所有阅读标签页共用。</p>
        <label for="api-model">Model</label>
        <input id="api-model" name="model" placeholder="服务提供的模型名称" required autocomplete="off" spellcheck="false">
        <p class="field-hint">翻译时，当前屏涉及的完整原文段落会发送到以上服务地址。</p>
        <p id="translation-settings-error" role="alert" hidden></p>
        <div class="dialog-actions">
            <button type="button" id="clear-translation-settings">清除配置</button>
            <button type="submit" id="save-translation-settings">保存设置</button>
        </div>
    </form>
</dialog>
<script src="reader.js" type="module"></script>
